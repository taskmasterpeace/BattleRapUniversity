name: Security dependency validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - run: pnpm install --frozen-lockfile --ignore-scripts --strict-peer-dependencies
      - run: pnpm why next sharp tar
