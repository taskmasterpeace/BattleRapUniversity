name: World Heartbeat

# The UniverCity doesn't stop. Every hour: book + simulate world battles,
# fire world events into the press, resolve due player battles, and keep
# offer inboxes warm. Vercel Hobby crons run these once daily as backup.
on:
  schedule:
    - cron: '7 * * * *' # hourly at :07
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: World tick (book + simulate AI cards)
        run: |
          curl -sf -X POST "https://battle-rap-university.vercel.app/api/internal/run-world-tick" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" || echo "world-tick failed (endpoint may not be live yet)"
      - name: World events (press drops)
        run: |
          curl -sf -X POST "https://battle-rap-university.vercel.app/api/internal/run-world-events" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}" || echo "world-events failed (endpoint may not be live yet)"
      - name: Resolve due player battles
        run: |
          curl -sf -X POST "https://battle-rap-university.vercel.app/api/internal/run-due-battles" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}"
      - name: Replenish battle offers
        run: |
          curl -sf -X POST "https://battle-rap-university.vercel.app/api/internal/generate-battle-offers" \
            -H "Authorization: Bearer ${{ secrets.INTERNAL_API_SECRET }}"
