<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpriteX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #111;
      padding: 12px 20px;
      border-bottom: 2px solid #f97316;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 22px;
      color: #f97316;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 900;
    }
    .header-controls { display: flex; gap: 10px; align-items: center; }

    /* Mode Toggle */
    .mode-toggle {
      display: flex;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
    }
    .mode-toggle button {
      padding: 8px 16px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-toggle button.active {
      background: #f97316;
      color: #000;
    }
    .mode-toggle button:hover:not(.active) { color: #fff; }

    /* Main Layout */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Canvas Area */
    .canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0d0d0d;
      position: relative;
    }
    .canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #mainCanvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }
    .drop-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 10, 0.95);
      z-index: 10;
    }
    .drop-overlay.hidden { display: none; }
    .drop-overlay.dragover { background: rgba(249, 115, 22, 0.1); border: 3px dashed #f97316; }
    .drop-overlay h2 { color: #f97316; font-size: 28px; margin-bottom: 10px; }
    .drop-overlay p { color: #666; font-size: 14px; }
    .drop-overlay input { display: none; }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background: #111;
      border-left: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-section {
      padding: 15px;
      border-bottom: 1px solid #222;
    }
    .sidebar-section h3 {
      color: #f97316;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    /* Settings */
    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .setting label { color: #888; font-size: 12px; }
    .setting input {
      width: 70px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      text-align: right;
    }
    .setting input:focus { border-color: #f97316; outline: none; }

    /* Crop List */
    .crop-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
    }
    .crop-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #1a1a1a;
      margin-bottom: 5px;
      border-left: 3px solid #22c55e;
      font-size: 11px;
      font-family: monospace;
    }
    .crop-item button {
      background: #ef4444;
      border: none;
      color: white;
      width: 20px;
      height: 20px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }
    .no-crops { color: #555; font-size: 12px; text-align: center; padding: 20px; }

    /* Action Buttons */
    .actions {
      padding: 15px;
      background: #0a0a0a;
    }
    .extract-btn {
      width: 100%;
      padding: 14px;
      background: #f97316;
      border: none;
      color: #000;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .extract-btn:hover { background: #fb923c; }
    .extract-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    .extract-btn.loading { background: #666; }

    .secondary-btns {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .secondary-btns button {
      flex: 1;
      padding: 8px;
      background: #222;
      border: 1px solid #333;
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .secondary-btns button:hover { background: #333; color: #fff; }

    /* Status Bar */
    .status-bar {
      padding: 8px 15px;
      background: #0a0a0a;
      border-top: 1px solid #222;
      font-size: 11px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    .status-bar .success { color: #22c55e; }
    .status-bar .error { color: #ef4444; }

    /* Results Panel */
    .results-panel {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      flex-direction: column;
    }
    .results-panel.visible { display: flex; }
    .results-header {
      padding: 15px 20px;
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .results-header h2 { color: #22c55e; font-size: 16px; }
    .results-header button {
      background: #333;
      border: none;
      color: #fff;
      padding: 8px 16px;
      cursor: pointer;
    }
    .results-grid {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .result-sprite {
      background: repeating-conic-gradient(#222 0% 25%, #1a1a1a 0% 50%) 50% / 10px 10px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
    }
    .result-sprite img { max-width: 100%; max-height: 100%; }

    /* Loading */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 50;
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-overlay p { margin-top: 15px; color: #888; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SpriteX</h1>
    <div class="header-controls">
      <div class="mode-toggle">
        <button class="active" data-mode="auto" onclick="setMode('auto')">Auto Grid</button>
        <button data-mode="manual" onclick="setMode('manual')">Manual Crop</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="canvas-area">
      <div class="canvas-container" id="canvasContainer">
        <canvas id="mainCanvas"></canvas>
      </div>

      <div class="drop-overlay" id="dropOverlay">
        <h2>Drop Sprite Sheet</h2>
        <p>or click to browse</p>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p>Extracting sprites...</p>
      </div>

      <div class="results-panel" id="resultsPanel">
        <div class="results-header">
          <h2 id="resultsTitle">Extracted 0 Sprites</h2>
          <button onclick="closeResults()">Close</button>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Image</h3>
        <div class="setting">
          <label>File</label>
          <span id="fileName" style="color:#f97316;font-size:12px;">None</span>
        </div>
        <div class="setting">
          <label>Size</label>
          <span id="imageSize" style="color:#888;font-size:12px;">-</span>
        </div>
      </div>

      <div class="sidebar-section" id="gridSettings">
        <h3>Grid Settings</h3>
        <div class="setting">
          <label>Rows</label>
          <input type="number" id="rows" value="5" min="1" max="20">
        </div>
        <div class="setting">
          <label>Columns</label>
          <input type="number" id="cols" value="8" min="1" max="20">
        </div>
        <div class="setting">
          <label>Trim Grid (px)</label>
          <input type="number" id="trimGrid" value="15" min="0" max="50">
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Processing</h3>
        <div class="setting">
          <label>Tolerance</label>
          <input type="number" id="tolerance" value="80" min="0" max="255">
        </div>
        <div class="setting">
          <label>Output Folder</label>
          <input type="text" id="outputFolder" value="extracted" style="width:100px;">
        </div>
      </div>

      <div class="sidebar-section" id="cropSection" style="display:none;">
        <h3>Crop Regions (<span id="cropCount">0</span>)</h3>
      </div>
      <div class="crop-list" id="cropList" style="display:none;">
        <div class="no-crops">Click and drag on the image to add crop regions</div>
      </div>

      <div class="actions">
        <button class="extract-btn" id="extractBtn" disabled onclick="extract()">
          Extract Sprites
        </button>
        <div class="secondary-btns" id="manualBtns" style="display:none;">
          <button onclick="undoCrop()">Undo</button>
          <button onclick="clearCrops()">Clear All</button>
        </div>
      </div>

      <div class="status-bar">
        <span id="status">Ready</span>
        <span id="cellSize">-</span>
      </div>
    </div>
  </div>

  <script>
    let mode = 'auto';
    let image = null;
    let imagePath = '';
    let uploadedPath = '';
    let crops = [];
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentBox = null;
    let scale = 1;

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const dropOverlay = document.getElementById('dropOverlay');
    const fileInput = document.getElementById('fileInput');
    const canvasContainer = document.getElementById('canvasContainer');

    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll('.mode-toggle button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === newMode);
      });

      document.getElementById('gridSettings').style.display = newMode === 'auto' ? 'block' : 'none';
      document.getElementById('cropSection').style.display = newMode === 'manual' ? 'block' : 'none';
      document.getElementById('cropList').style.display = newMode === 'manual' ? 'block' : 'none';
      document.getElementById('manualBtns').style.display = newMode === 'manual' ? 'flex' : 'none';

      crops = [];
      updateCropList();
      redraw();
      updateStatus();
    }

    // File handling
    dropOverlay.addEventListener('click', () => fileInput.click());
    dropOverlay.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.classList.add('dragover'); });
    dropOverlay.addEventListener('dragleave', () => dropOverlay.classList.remove('dragover'));
    dropOverlay.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('dragover');
      if (e.dataTransfer.files[0]) await loadImage(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', async (e) => {
      if (e.target.files[0]) await loadImage(e.target.files[0]);
    });

    async function loadImage(file) {
      imagePath = file.name;

      // Upload to server
      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          uploadedPath = data.path;
        }
      } catch (e) {
        console.error('Upload failed:', e);
      }

      // Load image for preview
      const reader = new FileReader();
      reader.onload = (e) => {
        image = new Image();
        image.onload = () => {
          fitToContainer();
          dropOverlay.classList.add('hidden');
          document.getElementById('fileName').textContent = imagePath;
          document.getElementById('imageSize').textContent = `${image.width} × ${image.height}`;
          document.getElementById('extractBtn').disabled = false;
          crops = [];
          updateCropList();
          redraw();
          updateStatus();
        };
        image.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function fitToContainer() {
      const containerRect = canvasContainer.getBoundingClientRect();
      const padding = 40;
      const maxW = containerRect.width - padding;
      const maxH = containerRect.height - padding;

      scale = Math.min(maxW / image.width, maxH / image.height, 1);

      canvas.width = image.width * scale;
      canvas.height = image.height * scale;
      canvas.style.width = canvas.width + 'px';
      canvas.style.height = canvas.height + 'px';
    }

    // Canvas interaction
    canvas.addEventListener('mousedown', (e) => {
      if (mode !== 'manual' || !image) return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      startX = (e.clientX - rect.left) / scale;
      startY = (e.clientY - rect.top) / scale;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !image) return;
      const rect = canvas.getBoundingClientRect();
      const currentX = (e.clientX - rect.left) / scale;
      const currentY = (e.clientY - rect.top) / scale;

      const dx = currentX - startX;
      const dy = currentY - startY;
      const size = Math.max(Math.abs(dx), Math.abs(dy));
      const signX = dx >= 0 ? 1 : -1;
      const signY = dy >= 0 ? 1 : -1;

      currentBox = {
        x: signX > 0 ? startX : startX - size,
        y: signY > 0 ? startY : startY - size,
        width: size,
        height: size
      };
      redraw();
    });

    canvas.addEventListener('mouseup', () => {
      if (!isDrawing || !currentBox) return;
      isDrawing = false;
      if (currentBox.width >= 30) {
        crops.push({
          x: Math.round(currentBox.x),
          y: Math.round(currentBox.y),
          width: Math.round(currentBox.width),
          height: Math.round(currentBox.height)
        });
        updateCropList();
        updateStatus();
      }
      currentBox = null;
      redraw();
    });

    function redraw() {
      if (!image) return;

      ctx.save();
      ctx.scale(scale, scale);
      ctx.drawImage(image, 0, 0);

      if (mode === 'auto') {
        const rows = parseInt(document.getElementById('rows').value) || 5;
        const cols = parseInt(document.getElementById('cols').value) || 8;
        const cellW = image.width / cols;
        const cellH = image.height / rows;

        ctx.strokeStyle = 'rgba(249, 115, 22, 0.6)';
        ctx.lineWidth = 1 / scale;

        for (let i = 1; i < cols; i++) {
          ctx.beginPath();
          ctx.moveTo(i * cellW, 0);
          ctx.lineTo(i * cellW, image.height);
          ctx.stroke();
        }
        for (let i = 1; i < rows; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * cellH);
          ctx.lineTo(image.width, i * cellH);
          ctx.stroke();
        }

        document.getElementById('cellSize').textContent = `Cell: ${Math.round(cellW)}×${Math.round(cellH)}`;
      } else {
        document.getElementById('cellSize').textContent = `${crops.length} crops`;
      }

      // Draw crops
      if (mode === 'manual') {
        crops.forEach((crop, i) => {
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 2 / scale;
          ctx.strokeRect(crop.x, crop.y, crop.width, crop.height);
          ctx.fillStyle = 'rgba(34, 197, 94, 0.15)';
          ctx.fillRect(crop.x, crop.y, crop.width, crop.height);

          ctx.fillStyle = '#22c55e';
          ctx.font = `bold ${14 / scale}px sans-serif`;
          ctx.fillText(`${i + 1}`, crop.x + 4 / scale, crop.y + 16 / scale);
        });

        if (currentBox) {
          ctx.strokeStyle = '#f97316';
          ctx.lineWidth = 2 / scale;
          ctx.setLineDash([5 / scale, 5 / scale]);
          ctx.strokeRect(currentBox.x, currentBox.y, currentBox.width, currentBox.height);
          ctx.setLineDash([]);
        }
      }

      ctx.restore();
    }

    function updateCropList() {
      const list = document.getElementById('cropList');
      document.getElementById('cropCount').textContent = crops.length;

      if (crops.length === 0) {
        list.innerHTML = '<div class="no-crops">Click and drag on the image to add crop regions</div>';
      } else {
        list.innerHTML = crops.map((c, i) => `
          <div class="crop-item">
            <span>#${i + 1}: ${c.x},${c.y} ${c.width}×${c.height}</span>
            <button onclick="removeCrop(${i})">×</button>
          </div>
        `).join('');
      }
    }

    window.removeCrop = (i) => { crops.splice(i, 1); updateCropList(); redraw(); updateStatus(); };
    function undoCrop() { crops.pop(); updateCropList(); redraw(); updateStatus(); }
    function clearCrops() { crops = []; updateCropList(); redraw(); updateStatus(); }

    function updateStatus() {
      const status = document.getElementById('status');
      if (!image) {
        status.textContent = 'Drop an image to start';
        return;
      }
      if (mode === 'auto') {
        const rows = parseInt(document.getElementById('rows').value) || 5;
        const cols = parseInt(document.getElementById('cols').value) || 8;
        status.textContent = `Ready: ${rows * cols} sprites`;
      } else {
        status.textContent = crops.length > 0 ? `Ready: ${crops.length} sprites` : 'Draw crop regions';
      }
    }

    async function extract() {
      if (!image || !uploadedPath) return;
      if (mode === 'manual' && crops.length === 0) {
        alert('Draw crop regions first!');
        return;
      }

      document.getElementById('loadingOverlay').classList.add('visible');
      document.getElementById('extractBtn').disabled = true;

      const settings = {
        rows: parseInt(document.getElementById('rows').value) || 5,
        cols: parseInt(document.getElementById('cols').value) || 8,
        tolerance: parseInt(document.getElementById('tolerance').value) || 80,
        trimGrid: parseInt(document.getElementById('trimGrid').value) || 15
      };

      try {
        const res = await fetch('/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            mode,
            inputPath: uploadedPath,
            outputFolder: document.getElementById('outputFolder').value || 'extracted',
            settings,
            crops
          })
        });

        const data = await res.json();

        document.getElementById('loadingOverlay').classList.remove('visible');
        document.getElementById('extractBtn').disabled = false;

        if (data.success) {
          showResults(data.files, data.count);
        } else {
          alert('Extraction failed. Check console for details.');
          console.error(data.stderr);
        }
      } catch (e) {
        document.getElementById('loadingOverlay').classList.remove('visible');
        document.getElementById('extractBtn').disabled = false;
        alert('Error: ' + e.message);
      }
    }

    function showResults(files, count) {
      document.getElementById('resultsTitle').textContent = `Extracted ${count} Sprites`;
      const grid = document.getElementById('resultsGrid');
      grid.innerHTML = files.map(f => `
        <div class="result-sprite">
          <img src="${f}" alt="sprite">
        </div>
      `).join('');
      document.getElementById('resultsPanel').classList.add('visible');
    }

    function closeResults() {
      document.getElementById('resultsPanel').classList.remove('visible');
    }

    // Settings change handlers
    ['rows', 'cols', 'trimGrid', 'tolerance'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => { redraw(); updateStatus(); });
    });

    // Window resize
    window.addEventListener('resize', () => { if (image) { fitToContainer(); redraw(); } });

    // Initial state
    updateStatus();
  </script>
</body>
</html>
